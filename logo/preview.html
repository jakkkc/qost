<!doctype html><html data-theme="auto"><head><meta charset="utf-8"><title>Qost logo preview</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--page:#ECE8E1;--card:#FAF6F0;--ui:#2B2D31}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#17181A;--card:#2B2D31;--ui:#FAF6F0}}
:root[data-theme=dark]{--page:#17181A;--card:#2B2D31;--ui:#FAF6F0}
:root[data-theme=light]{--page:#ECE8E1;--card:#FAF6F0;--ui:#2B2D31}
body{margin:0;background:var(--page);color:var(--ui);font-family:system-ui,sans-serif;padding:16px;display:grid;gap:16px;justify-items:center}
.bar{display:flex;gap:8px}.bar button{font:inherit;padding:8px 16px;border-radius:999px;border:1px solid var(--ui);background:transparent;color:var(--ui);cursor:pointer}.bar button[aria-pressed=true]{background:#F27A1A;border-color:#F27A1A;color:#fff}
.card{background:var(--card);border-radius:16px;width:min(720px,100%);box-sizing:border-box}svg.qa{width:100%;height:auto;display:block}
.m{display:flex;gap:16px;align-items:end;padding:16px}.m svg{display:block}
</style></head><body>
<div class="bar" role="group" aria-label="Theme"><button data-t="auto" aria-pressed="true">Auto</button><button data-t="light" aria-pressed="false">Light</button><button data-t="dark" aria-pressed="false">Dark</button></div>
