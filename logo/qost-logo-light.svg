<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-label="Qost - From Stock to Profit">
<style>
.Lw{stroke-dasharray:1 1;stroke-dashoffset:1;animation:Ld 8s cubic-bezier(.65,0,.35,1) infinite}
.La{opacity:0;animation:Lf 8s ease-in-out infinite}
@keyframes Ld{0%{stroke-dashoffset:1}14%,74%{stroke-dashoffset:0}90%,100%{stroke-dashoffset:-1}}
@keyframes Lf{0%,8%{opacity:0}16%,74%{opacity:1}84%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.Lw{animation:none;stroke-dashoffset:0}.La{animation:none;opacity:1}}
.Ltgf{font-family:'Bebas Neue','Oswald','Arial Narrow',Impact,sans-serif;font-size:36px}
.Ll{opacity:0;animation:Lr 8s cubic-bezier(.22,1,.36,1) infinite}
@keyframes Lr{0%{opacity:0;transform:translateY(28px);filter:blur(6px);fill:#F27A1A}10%{opacity:1;transform:translateY(0);filter:blur(0);fill:#F27A1A}18%,72%{opacity:1;transform:translateY(0);filter:blur(0);fill:#2B2D31}86%,100%{opacity:0;transform:translateY(-28px);filter:blur(6px);fill:#2B2D31}}
@media (prefers-reduced-motion:reduce){.Ll{animation:none;opacity:1}}
</style>
